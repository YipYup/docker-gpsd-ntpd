name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v2
        with:
          dockerfile: Dockerfile

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -sSL -o shfmt https://github.com/mvdan/sh/releases/download/v3.6.5/shfmt_v3.6.5_linux_amd64
          chmod +x shfmt && sudo mv shfmt /usr/local/bin/

      - name: Run shellcheck on service scripts
        run: |
          find rootfs -type f -name run -print0 | xargs -0 shellcheck -x || true

      - name: Check shell formatting with shfmt
        run: |
          shfmt -l rootfs || (echo "shfmt formatting issues found" && exit 1)

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker image
        run: |
          docker build -t docker-gpsd-ntpd:ci .

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.12.7
        with:
          image-ref: docker-gpsd-ntpd:ci
          format: 'table'
          ignore-unfixed: true
