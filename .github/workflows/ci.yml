name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint Dockerfile (run via container)
        run: |
          # hadolint v2.12.0 digest: sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e
          docker run --rm -v "${{ github.workspace }}:/data" -w /data hadolint/hadolint@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e hadolint Dockerfile || true

      - name: Run shellcheck (docker image)
        run: |
          # koalaman/shellcheck:v0.9.0 -- pinned image
          docker run --rm -v "${{ github.workspace }}:/src" -w /src koalaman/shellcheck:v0.9.0 shellcheck -x /src/rootfs/**/run || true

      - name: Check shell formatting with shfmt (docker image)
        run: |
          # mvdan/shfmt:v3.6.5 -- pinned image
          docker run --rm -v "${{ github.workspace }}:/src" -w /src mvdan/shfmt:v3.6.5 shfmt -l /src/rootfs || (echo "shfmt formatting issues found" && exit 1)

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker image
        run: |
          docker build -t docker-gpsd-ntpd:ci .

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.12.7
        with:
          image-ref: docker-gpsd-ntpd:ci
          format: 'table'
          ignore-unfixed: true
