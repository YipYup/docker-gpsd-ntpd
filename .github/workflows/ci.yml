name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint Dockerfile (run via container)
        run: |
          docker run --rm -v "${{ github.workspace }}:/data" -w /data hadolint/hadolint:v2.12.0 hadolint Dockerfile || true

      - name: Run shellcheck on service scripts
        uses: koalaman/shellcheck-action@v1
        with:
          files: |
            rootfs/**/run
          extra_args: -x

      - name: Check shell formatting with shfmt
        uses: mvdan/sh-action@v1
        with:
          args: -l rootfs

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker image
        run: |
          docker build -t docker-gpsd-ntpd:ci .

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.12.7
        with:
          image-ref: docker-gpsd-ntpd:ci
          format: 'table'
          ignore-unfixed: true
