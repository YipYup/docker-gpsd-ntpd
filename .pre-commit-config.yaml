repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/pre-commit/mirrors-shellcheck
    rev: v0.9.0
    hooks:
      - id: shellcheck
        files: ^(rootfs/.*|.*\.sh)$

  - repo: https://github.com/mvdan/sh
    rev: v3.6.5
    hooks:
      - id: shfmt
        args: ["-i", "2", "-w"]
        files: ^(rootfs/.*|.*\.sh)$
